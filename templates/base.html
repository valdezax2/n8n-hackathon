<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fake CRM{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2230; --muted:#6b7280; --line:#e5e7eb; --accent:#3b5bdb; --accent-soft:#e7ecff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1e24; --ink:#e7e9ee; --muted:#9aa1ad; --line:#2a2f37; --accent:#7c93f5; --accent-soft:#232a45; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  a { color:var(--accent); text-decoration:none; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 24px; display:flex; gap:24px; align-items:center; }
  header .brand { font-weight:700; font-size:16px; color:var(--ink); }
  header nav a { color:var(--muted); margin-right:16px; }
  header nav a.active { color:var(--ink); font-weight:600; }
  main { max-width:1200px; margin:0 auto; padding:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:hover td { background:var(--accent-soft); }
  .muted { color:var(--muted); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; background:var(--accent-soft); color:var(--accent); margin:1px 2px 1px 0; }
  .s-Lead{background:#fff4e0;color:#a15c00} .s-Prospect{background:#e6f4ff;color:#0b5cad} .s-Qualified{background:#efe6ff;color:#6b35c9}
  .s-Customer{background:#e3f8ea;color:#17803d} .s-Churned{background:#fde8e8;color:#b42318}
  .positive{color:#17803d} .negative{color:#b42318} .neutral{color:var(--muted)}
  input, select, textarea, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  code, pre { font-family:ui-monospace, Menlo, monospace; font-size:13px; }
  pre { background:var(--bg); border:1px solid var(--line); padding:12px; border-radius:6px; overflow-x:auto; }
  .table-wrap { overflow-x:auto; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">Fake CRM</a>
  <nav>
    <a href="/" class="{{ 'active' if request.path == '/' }}">Contacts</a>
    <a href="/docs" class="{{ 'active' if request.path == '/docs' }}">API / n8n</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
